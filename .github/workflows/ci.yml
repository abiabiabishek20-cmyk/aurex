name: AUREX CI
on:
  push:
    branches: [main, cloud-first-foundation]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - name: Syntax-check server JavaScript
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
