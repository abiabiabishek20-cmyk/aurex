<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurex Control</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#070b14;color:#eef2ff}button,input{font:inherit}.app{min-height:100vh;padding:32px;max-width:1200px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-size:28px;font-weight:800;letter-spacing:.5px}.brand span{color:#8b5cf6}.status{display:flex;align-items:center;gap:8px;color:#b8c2d9;font-size:14px}.dot{width:10px;height:10px;border-radius:50%;background:#64748b}.dot.online{background:#22c55e;box-shadow:0 0 12px #22c55e}.hero{background:linear-gradient(135deg,#111827,#0d1220);border:1px solid #20283a;border-radius:20px;padding:26px;margin-bottom:20px}.hero h1{margin:0 0 8px;font-size:30px}.muted{color:#8995ad}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#0d1320;border:1px solid #20283a;border-radius:16px;padding:20px}.card h3{margin:0 0 8px}.value{font-size:22px;font-weight:700;margin:8px 0 18px}.actions{display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:11px 16px;background:#7c3aed;color:white;font-weight:700;cursor:pointer}button.secondary{background:#1b2435}button:disabled{opacity:.5;cursor:not-allowed}.url{width:100%;padding:11px;border:1px solid #303b51;border-radius:10px;background:#080d17;color:#fff;margin-bottom:10px;outline:none}.result{margin-top:18px;background:#080d17;border:1px solid #20283a;border-radius:12px;padding:14px;white-space:pre-wrap;color:#b9c5dd;min-height:70px}.wide{grid-column:1/-1}@media(max-width:800px){.grid{grid-template-columns:1fr}.app{padding:18px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><div class="brand">AU<span>REX</span> Control</div><div class="status"><span id="dot" class="dot"></span><span id="status">Checking...</span></div></header>
    <section class="hero"><h1>Desktop Control</h1><div class="muted">Secure control panel for your paired Aurex desktop agent.</div></section>
    <section class="grid">
      <div class="card"><h3>Device</h3><div id="device" class="value">Checking...</div><div class="muted">Paired Windows desktop</div></div>
      <div class="card"><h3>System</h3><div id="system" class="value">Not loaded</div><button id="sysBtn" class="secondary">Get System Info</button></div>
      <div class="card"><h3>Connection</h3><div id="ping" class="value">—</div><button id="pingBtn" class="secondary">Ping Device</button></div>
      <div class="card wide"><h3>Open URL</h3><input id="url" class="url" value="https://www.google.com" /><div class="actions"><button id="openBtn">Open on PC</button></div></div>
      <div class="card wide"><h3>Command Result</h3><div id="result" class="result">No command executed yet.</div></div>
    </section>
  </main>
<script>
const API='https://aurex-api-cvpd.onrender.com';
const $=id=>document.getElementById(id);
function show(data){$('result').textContent=JSON.stringify(data,null,2)}
async function call(path,options={}){const token=localStorage.getItem('aurex_device_token');if(!token)throw new Error('Device token not configured in this browser.');const r=await fetch(API+path,{...options,headers:{'Content-Type':'application/json','x-aurex-device-token':token,...(options.headers||{})}});const data=await r.json();if(!r.ok)throw new Error(data.error||'Request failed');return data}
async function run(path,options={}){try{const data=await call(path,options);show(data);return data}catch(e){show({ok:false,error:e.message})}}
$('pingBtn').onclick=async()=>{const d=await run('/api/desktop/ping',{method:'POST'});if(d?.ok){$('ping').textContent='Online';$('dot').classList.add('online');$('status').textContent='Connected';}};
$('sysBtn').onclick=async()=>{const d=await run('/api/desktop/system-info',{method:'POST'});if(d?.ok){$('system').textContent=d.command?.result?.platform+' '+d.command?.result?.release;$('device').textContent=d.device?.name||'My Windows PC';$('dot').classList.add('online');$('status').textContent='Connected';}};
$('openBtn').onclick=()=>run('/api/desktop/open-url',{method:'POST',body:JSON.stringify({url:$('url').value.trim()})});
</script>
</body>
</html>
