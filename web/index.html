<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurex Control</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#070b14;color:#eef2ff}button,input{font:inherit}.app{min-height:100vh;padding:32px;max-width:1200px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-size:28px;font-weight:800}.brand span{color:#8b5cf6}.status{display:flex;align-items:center;gap:8px;color:#aab4c8;font-size:14px}.dot{width:10px;height:10px;border-radius:50%;background:#64748b}.dot.online{background:#22c55e;box-shadow:0 0 12px #22c55e}.panel{background:#0d1320;border:1px solid #20283a;border-radius:18px;padding:24px}.login{max-width:420px;margin:12vh auto}.h{font-size:30px;font-weight:800;margin:0 0 8px}.muted{color:#8995ad}.field{width:100%;padding:12px;margin:8px 0;border:1px solid #303b51;border-radius:10px;background:#080d17;color:#fff;outline:none}.btn{border:0;border-radius:10px;padding:11px 16px;background:#7c3aed;color:white;font-weight:700;cursor:pointer}.btn.secondary{background:#1b2435}.err{color:#fca5a5;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#0d1320;border:1px solid #20283a;border-radius:16px;padding:20px}.card h3{margin:0 0 8px}.value{font-size:20px;font-weight:700;margin:8px 0 16px}.wide{grid-column:1/-1}.result{margin-top:14px;background:#080d17;border:1px solid #20283a;border-radius:12px;padding:14px;white-space:pre-wrap;color:#b9c5dd;min-height:70px}.hidden{display:none!important}@media(max-width:800px){.grid{grid-template-columns:1fr}.app{padding:18px}}</style></head><body><main class="app">
<section id="login" class="panel login"><div class="brand">AU<span>REX</span></div><h1 class="h">Control Center</h1><p class="muted">Sign in to control your paired desktop.</p><input id="email" class="field" type="email" placeholder="Email"><input id="password" class="field" type="password" placeholder="Password"><button id="loginBtn" class="btn" style="width:100%;margin-top:8px">Sign In</button><div id="loginErr" class="err"></div></section>
<section id="dashboard" class="hidden"><header class="top"><div class="brand">AU<span>REX</span> Control</div><div class="status"><span id="dot" class="dot"></span><span id="status">Offline</span><button id="logout" class="btn secondary">Logout</button></div></header><div class="panel" style="margin-bottom:20px"><h1 class="h">Desktop Control</h1><div id="user" class="muted">Authenticated</div></div><section class="grid">
<div class="card"><h3>Device</h3><div id="device" class="value">Loading...</div><div id="seen" class="muted">Checking connection</div></div><div class="card"><h3>System</h3><div id="system" class="value">Not loaded</div><button id="sysBtn" class="btn secondary">Get System Info</button></div><div class="card"><h3>Connection</h3><div id="ping" class="value">—</div><button id="pingBtn" class="btn secondary">Ping Device</button></div><div class="card wide"><h3>Open URL</h3><input id="url" class="field" value="https://www.google.com"><button id="openBtn" class="btn">Open on PC</button></div><div class="card wide"><h3>Command Result</h3><div id="result" class="result">No command executed yet.</div></div></section></section></main>
<script>const API='https://aurex-api-cvpd.onrender.com';let token=localStorage.getItem('aurex_jwt');let device=null;const $=id=>document.getElementById(id);function authHeaders(){return{Authorization:'Bearer '+token,'Content-Type':'application/json'}}async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{...authHeaders(),...(opt.headers||{})}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}function show(d){$('result').textContent=JSON.stringify(d,null,2)}async function waitCommand(id){for(let i=0;i<50;i++){const d=await api('/api/desktop/commands/'+id);if(d.command.status!=='queued')return d.command;await new Promise(r=>setTimeout(r,200))}throw new Error('Command timed out')}async function command(type,payload={}){if(!device)throw new Error('No paired device');const q=await api('/api/desktop/commands',{method:'POST',body:JSON.stringify({deviceId:device.id,type,payload})});const c=await waitCommand(q.command.id);show(c);return c}async function load(){const me=await api('/api/auth/me');$('user').textContent=me.user.email;const d=await api('/api/desktop/devices');device=d.devices[0];if(!device){$('device').textContent='No paired device';return}$('device').textContent=device.name;$('seen').textContent=device.last_seen_at?'Last seen: '+new Date(device.last_seen_at).toLocaleString():'Never seen';$('dot').classList.add('online');$('status').textContent='Authenticated'}function enter(){$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');load().catch(e=>{show({error:e.message});$('dot').classList.remove('online');$('status').textContent='Error'})}$('loginBtn').onclick=async()=>{try{const d=await fetch(API+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});const j=await d.json();if(!d.ok)throw new Error(j.error||'Login failed');token=j.token;localStorage.setItem('aurex_jwt',token);$('loginErr').textContent='';enter()}catch(e){$('loginErr').textContent=e.message}};$('logout').onclick=()=>{localStorage.removeItem('aurex_jwt');location.reload()};$('pingBtn').onclick=async()=>{try{const c=await command('ping');$('ping').textContent=c.status==='completed'?'Online':'Failed'}catch(e){show({error:e.message})}};$('sysBtn').onclick=async()=>{try{const c=await command('get_system_info');if(c.result)$('system').textContent=(c.result.platform||'')+' '+(c.result.release||'')}catch(e){show({error:e.message})}};$('openBtn').onclick=async()=>{try{await command('open_url',{url:$('url').value.trim()})}catch(e){show({error:e.message})}};if(token)enter();</script></body></html>
